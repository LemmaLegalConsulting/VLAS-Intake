      Please say yes or no. Are you receiving Medicaid, SSI, or TANF benefits?
    spanish: >-
      Por favor diga si o no. Esta recibiendo beneficios de Medicaid, SSI o TANF?
  record_assets_receives_benefits_question_tanf:
