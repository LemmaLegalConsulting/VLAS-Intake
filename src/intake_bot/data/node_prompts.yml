      Your intake is complete. Thank you for your time. Goodbye.
    spanish: >-
      Su entrevista de admision esta completa. Gracias por su tiempo. Adios.
  end_goodbye:
    english: >-
      Goodbye.
    spanish: >-
      Adios.

# Language
record_language:
  task_messages:
    - content: >-
        [Instructions]
        1. This is the language-selection step. The caller's preferred language has not been established yet.
        2. The initial language-selection question has already been spoken with explicit TTS voice switching.
        3. Do NOT repeat the full bilingual prompt unless the caller's response is ambiguous, mixed, or unclear.
        4. Do NOT choose the caller's language from a single word, a name, a place, an accent, or an uncertain transcription.
        5. Only accept an explicit language name: English, Spanish, ingles, inglés, espanol, or español.
        6. Do NOT interpret yes, no, si, sí, or any other affirmative or negative response as a language selection.
        7. Call `record_language` with exactly "English" or "Spanish" after the caller explicitly names one of those languages.
        8. If the response is ambiguous, mixed, or unclear, briefly ask the caller to say English or Spanish.

# Phone number
record_phone_number:
  task_messages:
    - content: >-
        [Instructions]
        1. The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the phone number is still unclear.
        2. Check if the caller's phone number is already available in the system.
          - If the caller confirms the number you already have is correct, call `record_phone_number` with that confirmed number.
          - If the caller says the existing number is incorrect, ask them for the correct number and continue this step.
          - If no phone number is available yet, collect the caller's phone number.
        3. After receiving a new or corrected phone number, ALWAYS read it back to the caller to confirm its accuracy.
          - IMPORTANT: After reading the number back, ask only whether the number is correct, and then wait for the caller's answer.
          - IMPORTANT: Read the phone number digit-by-digit (one digit at a time), not as a whole number.
          - IMPORTANT: Read the phone number in normal groupings of 3 digits, 3 digits, 4 digits.
          - IMPORTANT: Pronounce the digit 0 as "zero", not "O".
          - Example (English): For 8665345243, say "eight six six, five three four, five two four three".
          - Example (Spanish): For 8665345243, say "ocho seis seis, cinco tres cuatro, cinco dos cuatro tres".
          - Ask the confirmation as a direct question, for example: "I heard eight six six, five three four, five two four three. Is that correct?" (or in Spanish: "Escuché ocho seis seis, cinco tres cuatro, cinco dos cuatro tres. ¿Es correcto?")
          - If the caller indicates the number is incorrect, wait and see if they provide the correct number; if not, ask them to provide the correct number again, and then repeat the confirmation process.
          - If the caller gives an unclear answer to the confirmation question, repeat the confirmation question and wait for a clear yes-or-no answer.
        4. If the phone number provided is invalid, explain that you need a valid 10-digit US phone number and ask them to try again.
        5. ONLY use the `record_phone_number` function after the caller explicitly confirms that the phone number is correct.
        6. Do NOT ask for the phone type in this step. The next step will ask for it after the confirmed phone number has been saved.

        [System]
        Phone number: {phone_number}

record_phone_type:
  task_messages:
    - content: >-
        [Instructions]
        1. The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or gives an unclear response.
        2. The caller's phone number has already been confirmed. Do NOT ask for the phone number again unless the caller volunteers a correction.
        3. If the caller gives a synonym, normalize it when calling the function. Examples: cellular or movil -> mobile, casa -> home, trabajo -> work, otro -> other.
        4. If the caller gives an unclear or unrelated answer, ask again and wait for a clear phone type.
        5. ONLY use the `record_phone_type` function after the caller explicitly identifies the phone type.

        [System]
        Confirmed phone number: {phone_number}

# Name
record_name:
  task_messages:
    - content: >-
        [Instructions]
        1. The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the name is still unclear.
        2. After the caller provides their name, read back the full name and spell each part for confirmation.
          - IMPORTANT: Put a space between each letter (e.g., "J O H N"), NOT hyphens (e.g., "J-O-H-N") and NOT commas.
          - Use one clean confirmation in exactly this structure: "I heard [First] [Middle] [Last], spelled [F I R S T], [M I D D L E], [L A S T]. Is that correct?"
          - Spell every supplied name part in that single confirmation. Do NOT first say a part normally and then ask about its spelling in a separate question.
          - A letter-by-letter spelling supplied by the caller is authoritative. If the spoken transcription and spelling differ, reconstruct that name part from the letters and use the reconstructed spelling everywhere in the confirmation. For example, if the transcript says "John" but the caller spells "J O N," say "I heard Jon," never "I heard John, spelled J O N."
          - Pay special attention to middle names. If the caller gives a middle name like "Anne", confirm the spelling: "A N N E".
          - If a part of the name seems uncertain, ask for spelling right away rather than waiting.
        3. If the caller says the spelling is wrong, ask them to spell only the incorrect or unclear part when possible, rather than asking for the whole name again.
        4. If the caller confirms some parts of the name but corrects or spells another part in the same response, keep the confirmed parts and update only the corrected part.
        5. If the caller gives a pronunciation-based correction such as "It's Adamson" or "The last name is Damson," repeat back your best spelling guess and ask them to confirm or spell only that part.
        6. IMPORTANT: If the caller says "correct" or "yes" but then provides a spelling that does NOT match what you just spelled out, treat the caller's spelling as the authoritative version. Do NOT accept it as confirmed until you have reconciled the contradiction.
        7. Only use the `record_name` function after the caller confirms that the spelling of their full name is correct.
        8. Before calling the function, briefly say: "Thank you, let me save that."

# Service area
record_service_area:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the location is still unclear.

         1. Ask the caller in what city or county the issue happened. Do not assume that a bare place name is a county or an independent city.
         2. After the opening question, ALWAYS call the `record_service_area` function with every caller response, including a place name, yes, no, a correction, or a clarification. Function validation handles suggestions and caller confirmation.
        3. If the caller answers with something other than a city or county, or mixes a location with unrelated facts, acknowledge briefly, keep only the city or county if one was actually provided, and otherwise ask again for just the city or county.
        4. Do NOT ask the caller to confirm the location before calling the function. The function will handle validation and matching.
        5. The caller may later provide a different mailing or residential address. That is fine. The service area question is about where the issue happened, not where they live.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        In what city or county did this happen?

        If there was an error:
          - If the location did not match, ask the caller to clarify. For example: "I didn't find that location. Can you tell me the city or county again?"
          - If the caller gives a city, ask which county it is in if needed.
           - Do not encourage or assume a bare name such as "Danville" is a county or city; ask again for the city or county form when needed.
           - If a suggested location is rejected or cannot be confirmed, ask for the city or county again without declaring it uncovered. A different place name may replace the pending suggestion and should be validated immediately.
          - Only if the location is clearly outside Virginia or the caller refuses to provide a location, inform them that we cannot help and ask if they would like referral information.
          - If the location is outside Virginia: let the caller know and ask if they would like referral information.
          - Ask "Would you like referral information by phone or by text?" rather than reading out URLs or phone numbers unprompted.

# Case type
record_case_type:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the case description is still unclear.

        Ask the caller to describe their issue in their own words.
        If the caller's description already clearly identifies the legal problem, do not ask a generic category question or request the same description again. Proceed to call the function.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        In a few words, please describe your issue.

        After the caller provides a clear description, say: "Thank you. Let me check that." Then proceed to call the function.

        If the case type is ineligible:
          - Inform the caller that we cannot assist with this type of case.
          - Ask if they would like referral information by phone or by text.
          - Then end the conversation.

# Adverse parties
record_adverse_parties:
  task_messages:
    - content: >-
        [Instructions]
        No opening prompt has been spoken for this step. Ask one concise, context-aware question using the case description in the collected caller state.

        1. Ask who is on the other side of the issue using ordinary language appropriate to the case. For a divorce or separation, ask for the spouse or other person involved. For housing, ask for the landlord or property manager. For employment, ask for the employer. Otherwise ask for the person, company, agency, or organization on the other side.
        2. Do not claim that a particular person has a relationship to the caller unless the caller has said so. For example, a divorce description makes it appropriate to ask for the caller's spouse, but it does not establish that a previously named person is the spouse.
        3. If the caller's issue involves housing, eviction, or a landlord, ask about both the landlord and the property management company separately.
        4. IF the caller names an individual:
            - Keep what they give. If no optional details were volunteered, call `record_adverse_parties` immediately with `optional_details_confirmed=false`; do not ask optional-detail questions before this first call. Function validation will require the correct follow-up.
            - Ask for the individual's full name.
            - Also ask for any phone number if the caller knows it. If they only know the number without a type, save just the number.
            - If available, ask for date of birth.
            - Read back the full list for confirmation.
            - Then ask: "Are there any more?" If yes, collect the next one.
            - If an organization is already identified in the collected case description and the caller provides a contact person, include both the organization and the contact person as separate parties.
        5. IF the caller names a company, agency, bank, property manager, or other organization:
            - Record its full name in "organization_name". Do NOT split an organization name into first and last names.
            - If no business phone or contact was volunteered, call `record_adverse_parties` immediately with `optional_details_confirmed=false`. Function validation will instruct you to ask only whether the caller knows a business phone number or a specific individual contact.
            - NEVER ask for a date of birth or suffix for an organization.
            - A contact person must be a separate individual party, not fields on the organization party.
        6. IF the caller says there is no one on the other side:
            - Confirm and call the function with an empty list: adverse_parties = []
        7. Once all parties are confirmed, ALWAYS call the `record_adverse_parties` function with the adverse_parties argument.
            - Set `optional_details_confirmed` to true after the caller provides optional details or says they do not know them.
            - NEVER set `optional_details_confirmed` to true on the first function call for a party that has no optional details. The backend requires a follow-up round before it will accept that value.

        [Field Name Requirements]
        When calling the function, ALWAYS pass an "adverse_parties" argument containing a list of party objects.
        For an individual, use these EXACT field names:
        - "first" (required for an individual, not first_name, firstname, or firstName)
        - "middle" (optional, not middle_name, middlename, or middleName)
        - "last" (required for an individual, not last_name, lastname, or lastName)
        - "suffix" (optional, e.g., "Jr.", "Sr.", "II", "III")
        - "dob" (optional, date format YYYY-MM-DD, not date_of_birth or dateOfBirth)
        - "phones" (optional list of phone objects, not phone_numbers or phoneNumbers)
          - Each phone object must have: "number" (str)
          - Each phone object may also include: "type" (str: mobile, home, business, or fax) if the caller actually provides it
        For an organization, use:
        - "organization_name" (required; do not include first, middle, last, suffix, or dob)
        - "phones" (optional, using the same phone-object format above)

        [Examples - ALWAYS pass the adverse_parties argument]
        Example 1 - One party with complete information:
        adverse_parties = [{"first": "John", "middle": "Michael", "last": "Doe", "suffix": "Jr.", "dob": "1980-05-15", "phones": [{"number": "5555551234", "type": "mobile"}]}]

        Example 2 - One party with minimal information:
        adverse_parties = [{"first": "Jane", "last": "Smith"}]

        Example 3 - Multiple parties:
        adverse_parties = [
            {"first": "Robert", "last": "Johnson", "dob": "1975-03-20"},
          {"first": "Patricia", "middle": "Ann", "last": "Williams", "suffix": "III", "phones": [{"number": "5555555678", "type": "home"}]}
        ]

        Example 4 - No parties (empty list):
        adverse_parties = []

        Example 5 - Organization:
        adverse_parties = [{"organization_name": "First National Bank"}]

        [Critical Reminder]
        ALWAYS call the function with the "adverse_parties" argument, even if it's an empty list [].
        Do NOT call the function without specifying the adverse_parties argument.
        Omit any fields that you don't have a value for.
        A phone number without a type is still acceptable. Save the number and leave out the type.
        Do NOT skip directly to the next intake step if you already know there is someone on the other side but have not finished gathering or confirming the details.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Ask one concise question for the opposing person or organization, using the caller's case description to choose natural wording.

# Domestic violence
record_domestic_violence:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the response is still unclear.

        Ask one short question about domestic violence. If helpful, clarify that it can include physical violence, threats, yelling, throwing things, or controlling behavior.
        Once the caller answers yes or no, call the `record_domestic_violence` function with the boolean value.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Please say yes or no. Are you experiencing or have you experienced domestic violence, such as threats, yelling, throwing things, controlling behavior, or physical abuse?

        [Additional Notes]
        - The `is_experiencing` argument should be a boolean (True or False).
        - ALWAYS call the `record_domestic_violence` function after confirming the caller's response.

# Household Composition
record_household_composition:
  task_messages:
    - content: >-
        [Instructions]
        No opening prompt has been spoken for this step. Ask one concise question for two numbers: adults other than the caller, and children under 18.

        1. Ask: "Besides you, how many other adults live in your household, and how many children under 18?"
        2. If the caller previously reported domestic violence, do not include the person who harmed them in income or benefits calculations. Household composition still counts people who live there.
        3. The `number_of_other_adults` argument excludes the caller. The application adds the caller to produce the total adult count.
        4. A bare answer such as "none," "no one," or "nobody" means zero other adults and zero children. Call `record_household_composition(number_of_other_adults=0, number_of_children=0)`.
        5. If the caller supplies only one count, ask only for the missing count. Do not guess it.
        6. If the caller names household members or gives their relationships in the same answer, include them in `known_members` without inventing missing details. Use objects with `name` and, when stated, `relationship`.
        7. Once both counts are known, call `record_household_composition`, including any `known_members` from that answer. The next node will read the total counts back and wait for a separate confirmation.
        8. Do not read back or confirm the counts in this node. Do not call the function more than once in the same turn.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Besides you, how many other adults live in your household, and how many children under 18?
        (Only if the caller reported domestic violence: "Do not count anyone who has harmed you.")

        [Additional Notes]
        - Adults must be at least 18 years old.
        - Do not include the caller in `number_of_other_adults`; the application always includes the caller.
        - If the caller reported domestic violence, do NOT count anyone who has harmed them.
        - Children are anyone under 18 years old.
        - Include all children who live in the household.

confirm_household_composition:
  task_messages:
    - content: >-
        [Instructions]
        The proposed household counts have already been spoken to the caller as a yes-or-no confirmation.

        Proposed total adults including the caller: {number_of_adults}
        Proposed children under 18: {number_of_children}

        1. Wait for the caller's answer.
        2. If the caller clearly confirms the counts, call `confirm_household_composition(confirmed=true)`.
        3. If the caller says the counts are wrong without supplying corrected counts, call `confirm_household_composition(confirmed=false)`.
        4. If the caller supplies a correction, call `record_household_composition` with the corrected number of OTHER adults and children. For example, "No, it is me and my wife" means one other adult. Preserve an unchanged count when only one count is corrected.
        5. A correction is not a confirmation. The corrected totals must be read back by the next confirmation node and confirmed in a later caller turn.
        6. Never call both functions in one response.

# Household Members
record_household_members:
  task_messages:
    - content: >-
        [Instructions]
        No opening prompt has been spoken for this step. Use the caller name, case description, adverse parties, and confirmed household counts in the collected state.

        1. Identify every person included in the confirmed household count. Use `household_members_known` and the caller's confirmed name first.
        2. If a member's name is missing, ask for that person's name and relationship together. Never use placeholders such as "Unknown Child 1".
        3. If a member's name is known but the relationship is missing, ask only for that relationship. Do not repeat any confirmed household names or counts while asking for missing information.
        4. Reuse known information through a targeted confirmation. If exactly one known adverse party is a plausible match for a missing relationship, ask only: "Is your [relationship] [known name], the person you named earlier?"
        5. If the relationship is still missing but the case context makes "spouse" plausible, ask only: "Is [known name] your spouse?" Do not silently assume the answer.
        6. Never silently assume that an adverse party is the spouse or household member. Set `adverse_party_name` only after the caller explicitly confirms the match or explicitly gives the same person's name and relationship.
        7. Once every member's name and relationship are known, read back the complete list once and ask the caller to confirm it. Do not repeat the caller's name, household counts, or known member names before that final confirmation.
        8. Do not use a long setup such as "We have you..." or explain the future readback. Go directly to the one missing detail question.
        9. Call `record_household_members` with one object per confirmed household member using exactly these fields:
           - `name`: full name
           - `relationship`: relationship to the caller, using "self" for the caller
           - `is_caller`: true only for the caller
           - `adverse_party_name`: optional; the confirmed matching adverse party's full name

        The number of member objects must equal the confirmed number of adults plus children.

        [User Prompt]
        Ask only for missing household-member names or relationships. If a known person's relationship is the only missing detail, ask one concise targeted question and do not repeat confirmed names or household counts.

# Income
record_income:
  task_messages:
    - content: >-
        [Instructions]
        No opening prompt has been spoken for this step. The household-member names and relationships are already recorded in the collected state. Do not ask for them again.

        1. Begin with a concise, context-aware income question for each recorded household member. This includes adults and children. Exclude anyone who has perpetrated domestic violence against the caller.
           - For the household member whose `is_caller` field is true, always use second-person wording: "What income or benefits do you receive?" Use "you" and "your" in every follow-up and confirmation. Do NOT speak the caller's name when discussing the caller's own income.
           - Use the recorded name only for household members whose `is_caller` field is false: "What income or benefits does [name] receive?"
           - If the person has no income, record exactly {"No Household Income": {"amount": 0, "period": "Monthly"}}. Do not omit amount or period.
           - Also ask about monetary public benefits like food stamps, TANF, or SSI for children or other non-earning members. Medicaid is collected in the next step and must not be submitted as income.
        2. For each household member with income, collect:
           - The person's name
           - Income amount and period (Annually, Monthly, Weekly, Biweekly, Semi-Monthly, or Quarterly)
           - Sources of income using the income categories provided below
        3. If the caller says their entire household has no income, ask briefly how essential expenses like housing, utilities, and food are paid.
        4. After collecting the details for all members, read back a short summary and ask the caller to confirm it.
        5. If the caller says only "Social Security," ask whether it is Social Security Retirement, Social Security Disability, or SSI before recording it. Do not guess the category.

        IMPORTANT: Do NOT collect income information for anyone who has perpetrated domestic violence against the caller.
        Do not explain internal household exclusion rules or mention domestic-violence classifications in an income summary. Briefly state that income is not being collected for people excluded from the household calculation.

        [Child Support Handling]
        If the caller mentions receiving child support for a child, record this income under the name of the parent or guardian receiving it (usually the caller using their actual name), NOT under the child's name. For example, if Victoria receives child support for Sophie, record it under "Victoria" not "Sophie".

        [Income Period Values]
        When recording income, the period must be one of these values:
        - Annually (yearly income)
        - Monthly (monthly income)
        - Weekly (weekly income)
        - Biweekly (every two weeks)
        - Semi-Monthly (twice a month)
        - Quarterly (four times a year)

        [Income Categories]
        When recording income sources, use these category names:
        - Employment (wages, salary, self-employment)
        - Child Support
        - Spousal Support
        - Social Security Retirement
        - Social Security Disability
        - SSI
        - SSI/SSDI combo
        - Long-Term/Short-Term Disability
        - Workers Compensation
        - Unemployment Compensation
        - Pension/Retirement (Not Soc. Sec.)
        - TANF
        - Food Stamps
        - Veterans Benefits
        - Trust/Dividends/Annuity
        - No Household Income
        - Income Not Provided
        - Other

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Ask what income or benefits each already-recorded household member receives.

        [Additional Notes]
        - DO NOT collect income or asset information for any individual who has perpetrated domestic violence against you. These individuals should be completely excluded from the income calculation.
        - Income periods must be one of: Annually, Monthly, Weekly, Biweekly, Semi-Monthly, or Quarterly.
        - If the caller or any household member reports no income, this is a valid response. Record exactly {"No Household Income": {"amount": 0, "period": "Monthly"}} for that person.
        - When recording income, use the income category names as keys to ensure accurate processing.
        - After collecting the income details for each household member (including zero income if applicable), summarize the information back to the caller to confirm its accuracy. If any corrections are needed, update the details and repeat the confirmation process.
        - In the spoken summary, use "you" for the caller and names only for other household members. Continue using each person's actual recorded name as the key in the `income` function argument.
        - Once the caller confirms the summary is accurate, ALWAYS call the `record_income` function, even if all reported incomes are zero.
        - The `income` argument MUST map each confirmed household member's name directly to a mapping of category names. Do NOT use a top-level "members" list and do NOT include relationship or is_caller fields.
        - Exact example: income = {"Jon Patrick Adamson": {"Social Security Retirement": {"amount": 500, "period": "Monthly"}, "Food Stamps": {"amount": 200, "period": "Monthly"}}}
        - If the function reports a structural error, correct the function argument using this exact shape. The household membership is already confirmed, so do NOT ask the caller to reconfirm who lives in the household.
        - If a household member has NO income at all, submit ONLY "No Household Income" as their single income category, with amount 0 and period "Monthly". Do NOT enumerate every category at $0.
        - Include ALL household members, not just those with income. Children with no income should receive the exact zero-income entry above.
        - Include public benefits (food stamps, TANF, SSI) for children or other household members if the caller reports them.

        Important: Be sure to call the `record_income` function once the caller confirms the accuracy of the information, regardless of whether any income is reported. Use the income category names in the function call.

# Income over limit
confirm_income_over_limit:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer or asks for clarification.

        If the caller clearly agrees to continue (e.g., "yes"), call `continue_intake("record_assets_receives_benefits")`.
        If the caller clearly declines to continue (e.g., "no", "no thanks", "stop", "I don't want to"), do NOT continue the intake.
        Instead, ask whether they want referral information over the phone or sent by text.
        If they choose phone, call `send_over_limit_referral_and_end` with delivery_method="phone".
        If they choose text, call `send_over_limit_referral_and_end` with delivery_method="text".
        If the caller asks for additional resources, ask whether they want the information over the phone or sent by text, then call `send_over_limit_referral_and_end` with the matching delivery_method.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Your household income appears to be above the limit for our services. Do you wish to continue with the questions anyway?

# Assets
record_assets_receives_benefits:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the response is still unclear.

        Check the conversation summary. If the caller has ALREADY reported receiving TANF (Temporary Assistance for Needy Families) or SSI (Supplemental Security Income) as income, do not ask the generic question.
        Instead, acknowledge the benefit they already reported, and ask if they also receive Medicaid.

        Examples:
        - If they have TANF: "You mentioned receiving TANF. Do you also receive Medicaid?"
        - If they have SSI: "You mentioned receiving SSI. Do you also receive Medicaid?"
        - If unknown: "Are you receiving Medicaid, SSI, or TANF benefits?"

        Call `record_assets_receives_benefits` with:
        - receives_benefits=True (if they receive ANY of these: Medicaid, SSI, or TANF)
        - receives_benefits=False (if they receive NONE of these)
        - If SSI or TANF is already present in the income state, a "no" answer to the Medicaid follow-up means only that the caller does not also receive Medicaid. It does not negate the previously reported SSI or TANF, so call the function with receives_benefits=True.

        [User Prompt]
        (Translate to the caller's language if they are not speaking English)
        Are you receiving Medicaid, SSI, or TANF benefits?

record_assets_cash_accounts:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the response is still unclear.

        Ask one short question about cash, checking, or savings, then wait for the caller's answer.

        Do NOT call the function until the caller answers this question.
        Do NOT infer a no from silence or from answers about other asset categories.

        If the caller says they have none, call `record_assets_cash_accounts` with `assets=[]`.
        If the caller reports any of these assets, call `record_assets_cash_accounts` with `assets` as a list of one-key objects, for example `[{"checking account": 250}, {"cash": 40}]`.

        Only include cash, checking, and savings here.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Do you have any money in cash, checking, or savings?

record_assets_investments:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the response is still unclear.

        Ask one short question about countable investments such as stocks, bonds, or crypto, then wait for the caller's answer.

        Do NOT call the function until the caller answers this question.
        Do NOT infer a no from earlier answers about cash or other property.

        If the caller says they have none, call `record_assets_investments` with `assets=[]`.
        If the caller reports any investments, call `record_assets_investments` with `assets` as a list of one-key objects, for example `[{"stocks": 1200}, {"bonds": 800}]`.

        Do NOT include retirement accounts or pension funds here.
        Only include countable non-retirement investments here.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Do you have any non-retirement investments, like stocks, bonds, or crypto?

record_assets_other_property:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the response is still unclear.

        Ask one short question about other countable property, then wait for the caller's answer.

        Do NOT call the function until the caller answers this question.
        Do NOT infer a no from earlier answers about cash or investments.

        If the caller says they have none, call `record_assets_other_property` with `assets=[]`.
        If the caller reports any countable property, call `record_assets_other_property` with `assets` as a list of one-key objects, for example `[{"jewelry": 1500}, {"vacant land": 4000}]`.

        Do NOT include the caller's primary mode of transportation, the home they live in, or retirement funds.
        If the caller mentions an additional vehicle that is not their primary transportation, you may include it if it is otherwise countable.
        Only include countable property such as jewelry, business assets, collectibles, extra vehicles, or land other than the home they live in.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Do you own any other countable property, like jewelry, business assets, an extra vehicle that is not your main transportation, or land other than the home you live in?

record_assets_list:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the corrections are still unclear.

        Briefly confirm the countable assets collected so far, then ask if that sounds right.

        Assets collected so far:
        {current_assets_summary}

        If the caller confirms and no changes are needed, call `record_assets_list` without arguments.
        If the caller corrects the list, call `record_assets_list` with the corrected `assets` list using the same list-of-one-key-objects format.

        Do not invent assets or rename fields.
        Do not include the caller's primary transportation vehicle, the home the caller lives in, or retirement funds in the confirmed list.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Let me confirm your assets. Does that sound right?

# Assets over limit
confirm_assets_over_limit:
  task_messages:
    - content: >-
        [Instructions]

        If the caller clearly agrees to continue (e.g., "yes"), call `continue_intake("record_citizenship")`.
        If the caller clearly declines to continue (e.g., "no", "no thanks", "stop", "I don't want to"), do NOT continue the intake.
        Instead, ask whether they want referral information over the phone or sent by text.
        If they choose phone, call `send_over_limit_referral_and_end` with delivery_method="phone".
        If they choose text, call `send_over_limit_referral_and_end` with delivery_method="text".
        If the caller asks for additional resources, ask whether they want the information over the phone or sent by text, then call `send_over_limit_referral_and_end` with the matching delivery_method.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Your household assets appear to be above the limit for our services. Do you wish to continue with the questions anyway?

# Citizenship
record_citizenship:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the response is still unclear.

        1. Ask one short question about whether the caller is a US citizen.
        2. If the caller clearly says yes, call `record_citizenship(is_a_us_citizen=true, answer_was_explicit=true)`.
        3. If the caller clearly says no, call `record_citizenship(is_a_us_citizen=false, answer_was_explicit=true)`.
        4. If the caller explicitly refuses to answer, call `record_citizenship(is_a_us_citizen=false, answer_was_explicit=true)`.
        5. Do NOT treat silence, an unrelated answer, or a skipped turn as "no". Ask again until you get a clear yes, no, or explicit refusal.
        6. NEVER call `record_citizenship` without `answer_was_explicit=true`.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Please say yes or no. Are you a U.S. citizen?

# SSN Last 4
record_ssn_last_4:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the SSN last 4 is still unclear.

        1. Ask the caller for the last 4 digits of their social security number. Explain that you only need the last 4 digits.
        2. The caller may provide the digits in various formats (for example: "1234", "123-4", "1-23-4", etc.). Accept any reasonable format with 4 digits.
        3. After receiving the digits, read them back to the caller digit-by-digit (one digit at a time) and ask them to confirm they are correct.
           - IMPORTANT: Do NOT read the digits as a whole number (for example, say "one, two, three, four" NOT "one thousand two hundred thirty four").
           - If the caller confirms the digits are correct, proceed to the next step.
            - If the caller indicates the digits are incorrect, ask them to correct only the wrong digit or digits when possible, then repeat the confirmation.
            - If the caller corrects part of the sequence in the same response where they confirm the rest, keep the confirmed digits and update only the corrected digits.
        4. If the caller refuses to provide this information or provides a value that is not exactly 4 digits, explain that you need exactly 4 digits and ask them to try again.
            - Exception: If the caller explicitly refuses to provide their SSN, call the function with `ssn_last_4=""` and `ssn_unavailable_reason="refused"`.
            - Exception: If the caller explicitly says they do not know the last 4 digits, call the function with `ssn_last_4=""` and `ssn_unavailable_reason="does_not_know"`.
          5. NEVER call `record_ssn_last_4` with an empty string unless the caller explicitly refuses or explicitly says they do not know it.
          6. ONLY use the `record_ssn_last_4` function if the caller confirms their last 4 digits are correct (or if you are skipping as per the explicit exception).

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Please provide the last 4 digits of your social security number.

# Date of Birth
record_date_of_birth:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the date of birth is still unclear.

        1. Ask the caller for their date of birth.
        2. The caller may provide the date in various formats (for example: "January 15, 1980", "01/15/1980", "1980-01-15", etc.). Accept any reasonable date format.
        3. After receiving the date, read it back to the caller in a clear format (for example, "January 15, 1980") and ask them to confirm it is correct.
           - If the caller confirms the date is correct, proceed to the next step.
            - If the caller indicates only part of the date is wrong, ask them to correct only that part when possible, then repeat the full confirmation.
            - If the caller confirms some parts and corrects another part in the same response, keep the confirmed parts and update only the corrected part.
        4. If the date provided is invalid or is in the future, explain that you need a valid date of birth in the past and ask them to try again.
           - Exception: If the caller explicitly refuses to provide their date of birth or does not know it, you may proceed by calling the function with an empty string: date_of_birth=""
        5. ONLY use the `record_date_of_birth` function if the caller confirms their date of birth is correct (or if you are skipping as per the exception).
        6. When calling the function, ALWAYS convert the date to ISO format (YYYY-MM-DD).
           - IMPORTANT: In ISO format the order is Year-Month-Day. For example, July 8 1980 is 1980-07-08 (month=07, day=08), NOT 1980-08-07.
           - For Spanish: "8 de julio de 1980" means day=8, month=julio(7), year=1980 → 1980-07-08.
           - For Spanish: "15 de enero de 1992" means day=15, month=enero(1), year=1992 → 1992-01-15.
           - Double-check: the month number must match the month NAME the caller said, not the day number.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Please provide your date of birth.

# Address
record_address:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the address is still unclear.

        1. Ask the caller for their mailing address. This is where you will send any written information. It can be different from where the legal issue happened.
          - Street address (required)
          - Apartment, suite, or unit number (optional)
          - City (required)
          - State abbreviation, e.g., "VA" (required)
          - 5-digit ZIP code (required)
          - County (required)
          - IMPORTANT: In your initial question, ask for the county along with the other address fields. Do not leave county for a later question unless the caller omits it.
        2. If the caller does not include the county, ask a separate follow-up question asking only for the county, and wait for their answer.
          - IMPORTANT: Do NOT combine the county follow-up with the address confirmation.
          - IMPORTANT: Do NOT combine the county follow-up with any question about apartment, suite, or unit number.
        3. After all required address fields have been collected, read back the complete address to the caller and confirm it is accurate.
          - IMPORTANT: When reading back the numeric part of the street address, any unit number, and the ZIP code, say each digit individually.
          - IMPORTANT: After the last spoken digit of the street number, insert a brief pause before saying the street name. For example, say "two three two one nine, West Main Street," not "two, three, two, one, nine West Main Street."
          - IMPORTANT: When reading back the state, always say the full state name, not the abbreviation. For example, say "Virginia," not "V A."
          - IMPORTANT: Pronounce the digit 0 as "zero", not "O".
          - If the caller confirms the address is correct, proceed to the next step.
          - If the caller indicates any part is incorrect, ask only for the incorrect part when possible, then repeat the full confirmation.
          - If the street name, city, county, or other spoken words are unclear, ask the caller to spell only the unclear part.
          - If the caller confirms some parts and corrects another part in the same response, keep the confirmed parts and update only the corrected part.
          - Exception: If the caller explicitly refuses to provide their address or does not have one, you may proceed by calling the function with empty strings for all address fields.
        4. Only use the `record_address` function after the caller confirms that the address is correct (or if you are skipping as per the exception).
        5. If the city, county, or ZIP in the mailing address differs from what the caller said earlier about where the issue happened, that is okay. Just confirm the mailing address details and continue. Do not treat it as an error.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        What is your mailing address, including street, city, state, ZIP code, and county? Include any apartment or suite number if you have one.

# Names
record_names:
  task_messages:
    - content: >-
        [Instructions]
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer, asks for clarification, or the additional names are still unclear.

        1. Ask the caller if they have any other names they have been known by. This includes:
           - Maiden names or birth names
           - Names from previous marriages
           - Legally changed names
           - Nicknames
        2. If the caller provides other names, collect the name including first, middle, last, and any suffix.
           - Preserve any spelling the caller provides. If they spell it, use their spelling.
           - If they do not spell it, read back your best guess and confirm.
        3. For each additional name, ask the caller what type of name it is:
           - Maiden Name: A name from before marriage
           - Former Name: A name previously used that is no longer current
           - Nickname: A commonly used alternative name
           - Legal Name: Another official name in records
           If unclear, use Former Name as the default.
        4. After you have the name and its type, read it back by specifying each part (first, middle, and last name) and the type, then confirm with the caller that the spelling and type are correct.
           - IMPORTANT: Put a space between each letter (e.g., "J O H N"), NOT hyphens (e.g., "J-O-H-N") and NOT commas. This ensures each letter is spoken with a natural pause.
           - IMPORTANT: If the caller did not explicitly spell a part of the name, spell back the version you heard and ask whether it is correct, like `record_name` does.
           - IMPORTANT: Do NOT insist on a separate spelling-first turn for nicknames or other names if the caller can simply confirm or correct what you read back.
           - If the caller confirms the spelling and type are correct, continue to the next name or proceed to the next step.
           - If the caller indicates that any part of the name or type is incorrect, ask them to correct or spell only the incorrect part, update it, and then repeat the confirmation process.
           - If the caller confirms one part of the name but corrects or spells another part in the same response, accept both pieces of information together. For example, if they confirm the last name and spell the nickname in the same answer, keep the confirmed last name and update the nickname.
           - If a single spoken word is unclear, prefer a targeted follow-up such as "Could you spell just the first name?" instead of restarting the whole confirmation.
        5. If the caller has no other names to add, call the function with an empty list: names = []
        6. Once all names are confirmed and spelled correctly with types specified (or if the caller has no other names), ALWAYS call the `record_names` function with the names argument.

        [Field Name Requirements]
        When calling the function, ALWAYS pass a "names" argument containing a list of name objects.
        Use these EXACT field names for each name:
        - "first" (required, not first_name, firstname, or firstName)
        - "middle" (optional, not middle_name, middlename, or middleName)
        - "last" (required, not last_name, lastname, or lastName)
        - "suffix" (optional, e.g., "Jr.", "Sr.", "II", "III")
        - "type" (optional but recommended: "Former Name", "Maiden Name", "Nickname", "Legal Name", "Other")
          If omitted or not specified by caller, defaults to "Former Name"

        [Examples - ALWAYS pass the names argument]
        Example 1 - Caller provides one additional name (maiden name):
        names = [{"first": "Sarah", "middle": "Jane", "last": "Smith", "suffix": "Jr.", "type": "Maiden Name"}]

        Example 2 - Caller provides no additional names (empty list):
        names = []

        Example 3 - Caller provides two additional names with different types:
        names = [
          {"first": "Mary", "last": "Johnson", "type": "Maiden Name"},
          {"first": "Robert", "middle": "Lee", "last": "Davis", "suffix": "III", "type": "Former Name"}
        ]

        Example 4 - Caller provides name but doesn't specify type (will default to "Former Name"):
        names = [{"first": "Jane", "last": "Doe"}]

        [Critical Reminder]
        ALWAYS call the function with the "names" argument, even if it's an empty list [].
        Do NOT call the function without specifying the names argument.
        Omit any fields that you don't have a value for (except names should always be provided).
        If the caller doesn't specify a type, you will automatically apply the default type of "Former Name".
        If the type name is ambiguous, ask for clarification or use "Former Name" as default.
        If the caller provides a single name (e.g., "Jack") as a nickname or alias, assume the last name is the same as their legal last name unless they specify otherwise. Confirm this assumption with the caller.
        If the caller confirms that the last name is the same as their legal last name while also correcting or spelling the first name or nickname, treat that as a valid confirmation plus correction in one response.

        [User Prompt]
        (Translate this to the caller's language if they are not speaking English)
        Do you have any other names to include in your legal file, such as a maiden name, former name, or nickname used in legal records?


case_type_ineligible:
  task_messages:
    - content: >-
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer or asks for clarification.

        Apologize to the caller that Law-Line is not able to help with this type of case.
        Ask whether they want referral information over the phone or sent by text.
        If they choose phone, call `send_case_type_referral_and_end` with delivery_method="phone".
        If they choose text, call `send_case_type_referral_and_end` with delivery_method="text".

service_area_unserved:
  task_messages:
    - content: >-
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer or asks for clarification.

        Explain that the confirmed location is outside Law-Line's service area.
        Ask whether they want referral information over the phone or sent by text.
        If they choose phone, call `send_general_referral_and_end` with delivery_method="phone".
        If they choose text, call `send_general_referral_and_end` with delivery_method="text".

service_area_unresolved:
  task_messages:
    - content: >-
        The opening prompt for this step has already been spoken to the caller. Do NOT repeat it unless the caller did not answer or asks for clarification.

        Explain that Law-Line could not confirm whether the location is in its service area. Do NOT say that the location is outside the service area or that the case type is ineligible.
        Ask whether they want referral information over the phone or sent by text.
        If they choose phone, call `send_general_referral_and_end` with delivery_method="phone".
        If they choose text, call `send_general_referral_and_end` with delivery_method="text".
