      Please say yes or no. Let me confirm your assets: {current_assets_summary}. Does that sound right?
    spanish: >-
      Por favor diga si o no. Permitame confirmar sus bienes: {current_assets_summary}. Suena correcto?
  confirm_assets_over_limit_question:
