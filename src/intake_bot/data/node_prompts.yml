      What is your mailing address, including street, city, state, ZIP code, and county? Include any apartment or suite number if you have one.
    spanish: >-
      Cual es su direccion postal, incluyendo calle, ciudad, estado, codigo postal y condado? Incluya cualquier numero de apartamento o suite si tiene uno.
  case_type_ineligible_question:
