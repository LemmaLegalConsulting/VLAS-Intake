      Please say yes or no. Your household assets appear to be above the limit for our services. Do you wish to continue with the questions anyway?
    spanish: >-
      Por favor diga si o no. Los bienes de su hogar parecen estar por encima del limite para nuestros servicios. Desea continuar con las preguntas de todos modos?
  record_citizenship_question:
