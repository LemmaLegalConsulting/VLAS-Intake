# Official-name normalizations only. Bare locality names are suggestions,
# not exact matches, and require caller confirmation before coverage is stored.
official_name_normalizations:
  "Virginia Beach": "Virginia Beach City"

# Ambiguous names — short names that map to multiple possible Virginia localities
# When a user gives an ambiguous name, the system prompts them to disambiguate
# Only Franklin County here is not a configured locality; it will follow unresolved referral behavior
ambiguous_names:
  "franklin": ["Franklin City", "Franklin County"]

