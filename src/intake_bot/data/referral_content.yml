referral:
  spoken_en: >-
    I'm sorry, Law-Line is not able to help with that issue.
    Would you like me to give you referral information over the phone or send it by text?
  spoken_es: >-
    Lo siento, Law-Line no puede ayudar con ese asunto.
    Le gustaria recibir informacion de referencia por telefono o por mensaje de texto?
  phone_en: >-
    Please visit V L A S dot O R G and look for additional resources. Goodbye.
  phone_es: >-
    Por favor visite V L A S punto O R G y busque recursos adicionales. Adios.
  text_en: >-
    Okay. I will send you a link to additional resources now. Goodbye.
  text_es: >-
    Esta bien. Le enviare un enlace con recursos adicionales ahora. Adios.
  sms_en: >-
    Law-Line cannot help directly with this issue. You can find other resources here: https://www.vlas.org/additional-resources
  sms_es: >-
    Law-Line no puede ayudar directamente con este asunto. Puede encontrar otros recursos aqui: https://www.vlas.org/additional-resources
