[project]
    dependencies = [
        "aiohttp>=3.14.1",
        "loguru>=0.7.3",
        "phonenumberslite>=9.0.34",
        "pipecat-ai[azure,daily,deepgram,runner,silero,webrtc]>=1.5.0",
        "pipecatcloud>=1.0.0",
        "python-dotenv>=1.2.2",
        "pyyaml>=6.0.3",
        "rapidfuzz>=3.14.5",
    ]
    description = "Virginia Legal Aid Society (VLAS) Telephone Intake Bot"
    name = "intake-bot"
    readme = "README.md"
    requires-python = ">=3.12"
    version = "26.4.0"

[dependency-groups]
    dev = [
        "fastapi>=0.139.0",
        "pipecat-ai-cli>=1.3.0",
        "pipecat-ai-tail>=0.0.5",
        "pipecat-ai-whisker>=2.0.0",
        "pipecat-ai[websocket]>=1.5.0",
        "pytest-asyncio>=1.4.0",
        "pytest>=9.1.1",
        "uvicorn>=0.51.0",
    ]
    test = [
        "pytest-asyncio>=1.4.0",
        "pytest>=9.1.1",
    ]

[build-system]
    build-backend = "setuptools.build_meta"
    requires = [
        "setuptools",
    ]

[tool.setuptools.packages.find]
    where = [
        "src",
    ]

[tool.setuptools.package-data]
    intake_bot = [
        "data/*.yml",
    ]

[tool.pytest.ini_options]
    filterwarnings = [
        "ignore::DeprecationWarning:pipecat",
    ]
    minversion = "8.0"
    pythonpath = [
        "src",
    ]
    required_plugins = [
        "pytest-asyncio",
    ]
    testpaths = [
        "tests",
    ]
