[project]
    name            = "intake-bot"
    version         = "26.4.0"
    description     = "Virginia Legal Aid Society (VLAS) Telephone Intake Bot"
    readme          = "README.md"
    requires-python = ">=3.12"
    dependencies    = [
        "aiofiles>=25.1.0",
        "aiohttp>=3.14.3",
        "loguru>=0.7.3",
        "openai>=2.54.0",
        "phonenumberslite>=9.0.37",
        "pipecat-ai[azure,daily,deepgram,runner,silero,webrtc]>=1.7.0",
        "pipecatcloud>=1.1.0",
        "pydantic>=2.13.4",
        "python-dotenv>=1.2.3",
        "pyyaml>=6.0.3",
        "rapidfuzz>=3.14.5",
    ]

[dependency-groups]
    dev  = [
        "fastapi>=0.141.1",
        "pipecat-ai-cli>=1.3.0",
        "pipecat-ai-tail>=0.0.5",
        "pipecat-ai-whisker>=2.0.1",
        "pipecat-ai[websocket]>=1.7.0",
        "pytest>=9.1.1",
        "pytest-asyncio>=1.4.0",
        "types-aiofiles>=25.1.0.20260518",
        "types-pyyaml>=6.0.12.20260815",
        "uvicorn>=0.52.4",
    ]
    test = [
        "pytest>=9.1.1",
        "pytest-asyncio>=1.4.0",
    ]

[build-system]
    requires      = [
        "uv_build>=0.12.5,<0.13",
    ]
    build-backend = "uv_build"

[tool.pyrefly]
    project-includes = [
        "**/*.py*",
        "**/*.ipynb",
    ]
    project-excludes = [
        "tests/**",
    ]
    search-path      = [
        "src",
        ".",
        "client/python",
    ]

[tool.pytest.ini_options]
    filterwarnings   = [
        "ignore::DeprecationWarning:pipecat",
    ]
    minversion       = "8.0"
    pythonpath       = [
        "src",
    ]
    required_plugins = [
        "pytest-asyncio",
    ]
    testpaths        = [
        "tests",
    ]

[tool.ruff.lint]
    extend-select = ["I"]
