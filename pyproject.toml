[project]
    name            = "intake-bot"
    version         = "26.4.0"
    description     = "Virginia Legal Aid Society (VLAS) Telephone Intake Bot"
    readme          = "README.md"
    requires-python = ">=3.12"
    dependencies    = [
        "aiofiles>=25.1.0",
        "aiohttp>=3.14.1",
        "loguru>=0.7.3",
        "openai>=2.45.0",
        "phonenumberslite>=9.0.34",
        "pipecat-ai[azure,daily,deepgram,runner,silero,webrtc]>=1.5.0",
        "pipecatcloud>=1.0.0",
        "pydantic>=2.0.0",
        "python-dotenv>=1.2.2",
        "pyyaml>=6.0.3",
        "rapidfuzz>=3.14.5",
    ]

[dependency-groups]
    dev  = [
        "fastapi>=0.139.0",
        "pipecat-ai-cli>=1.3.0",
        "pipecat-ai-tail>=0.0.5",
        "pipecat-ai-whisker>=2.0.0",
        "pipecat-ai[websocket]>=1.5.0",
        "pytest>=9.1.1",
        "pytest-asyncio>=1.4.0",
        "ruff>=0.15.21",
        "uvicorn>=0.51.0",
    ]
    test = [
        "pytest>=9.1.1",
        "pytest-asyncio>=1.4.0",
    ]

[build-system]
    requires      = [
        "setuptools",
    ]
    build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
    filterwarnings   = [
        "ignore::DeprecationWarning:pipecat",
    ]
    minversion       = "8.0"
    pythonpath       = [
        "src",
    ]
    required_plugins = [
        "pytest-asyncio",
    ]
    testpaths        = [
        "tests",
    ]

[tool.setuptools.packages.find]
    where = [
        "src",
    ]

[tool.setuptools.package-data]
    intake_bot = [
        "data/*.json",
        "data/*.yml",
    ]
