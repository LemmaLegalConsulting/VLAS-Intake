# Keep dependency and Action updates visible as reviewable pull requests.
version: 2
updates:
- package-ecosystem: docker
  directories:
  - /
  - /demo
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directories:
  - /client/typescript
  - /demo/web
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: pip
  directories:
  - /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
